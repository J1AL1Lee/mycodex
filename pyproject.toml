[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycodex"
version = "0.1.0"
description = "A minimal Codex-style coding agent built for learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.3.0",
]

[project.scripts]
mycodex = "mycodex.main:main"

[tool.setuptools]
package-dir = { mycodex = "." }
packages = [
    "mycodex",
    "mycodex.agents",
    "mycodex.llm",
    "mycodex.llm.tests",
    "mycodex.tools",
]
